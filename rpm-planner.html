<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPM Life Planner</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233F5E36'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='40' font-weight='600' fill='%23FDFBF5' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F4F0E6; --bg-deep: #EBE5D3;
  --surface: #FDFBF5; --surface-2: #F2EDDF; --surface-3: #E8E1CC;
  --border: #D8CFB8; --border-strong: #B8AC8E;
  --text: #1F1B14; --text-muted: #6B6353; --text-soft: #948B78;
  --accent: #3F5E36; --accent-2: #5C8050; --accent-soft: #D6E5C9; --accent-pale: #E8F1DE;
  --gold: #B8923A; --gold-soft: #F0E2BD;
  --warn: #B87233; --warn-soft: #F5DCC0;
  --danger: #A8453C; --danger-soft: #F2CEC9;
  --info: #3D6394; --info-soft: #CDDEEF;
  --purple: #6B4E8C; --purple-soft: #DCD0E8;
  --rose: #A8506C; --rose-soft: #ECC7D3;
  --shadow-sm: 0 1px 2px rgba(31,27,20,0.04);
  --shadow: 0 2px 8px rgba(31,27,20,0.06);
  --shadow-lg: 0 12px 32px rgba(31,27,20,0.10);
  --radius: 10px; --radius-sm: 6px; --radius-lg: 16px;
  --sans: 'DM Sans', system-ui, sans-serif;
  --serif: 'DM Serif Display', Georgia, serif;
  --mono: 'Space Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; overflow-x: hidden; font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-weight: 400; letter-spacing: -0.01em; }
.section-title { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-soft); margin-bottom: 8px; display: block; }
.serif { font-family: var(--serif); }
.mono { font-family: var(--mono); }
button { font-family: inherit; cursor: pointer; border: none; border-radius: var(--radius-sm); padding: 8px 14px; font-weight: 600; font-size: 14px; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: white; box-shadow: var(--shadow-sm); }
.btn-primary:hover:not(:disabled) { background: var(--accent-2); transform: translateY(-1px); box-shadow: var(--shadow); }
.btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover:not(:disabled) { background: var(--surface-2); border-color: var(--border-strong); }
.btn-ghost { background: transparent; color: var(--text-muted); }
.btn-ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.btn-danger { background: var(--danger-soft); color: var(--danger); }
.btn-danger:hover:not(:disabled) { background: var(--danger); color: white; }
.btn-gold { background: var(--gold-soft); color: var(--gold); }
.btn-gold:hover:not(:disabled) { background: var(--gold); color: white; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-icon { padding: 6px 8px; background: transparent; color: var(--text-muted); }
.btn-icon:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
input, textarea, select { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; background: var(--surface); font-family: var(--sans); color: var(--text); width: 100%; outline: none; font-size: 14px; transition: border-color 0.15s, box-shadow 0.15s; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { resize: vertical; min-height: 80px; line-height: 1.55; }
input[type=range] { padding: 0; background: transparent; border: none; }
input[type=date] { font-family: var(--mono); font-size: 12px; }
input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow-sm); }
.card-flat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 12px; }
.card-elevated { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
.card-accent { background: var(--accent-pale); border: 1px solid var(--accent-soft); border-radius: var(--radius); padding: 18px; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
.badge-active { background: var(--accent-soft); color: var(--accent); }
.badge-hold { background: var(--warn-soft); color: var(--warn); }
.badge-complete { background: var(--surface-3); color: var(--text-muted); }
.badge-personal { background: var(--info-soft); color: var(--info); }
.badge-professional { background: var(--warn-soft); color: var(--warn); }
.badge-made { background: var(--accent-soft); color: var(--accent); }
.badge-received { background: var(--info-soft); color: var(--info); }
.badge-missed { background: var(--danger-soft); color: var(--danger); }
.badge-gold { background: var(--gold-soft); color: var(--gold); }
.badge-purple { background: var(--purple-soft); color: var(--purple); }
.badge-rose { background: var(--rose-soft); color: var(--rose); }
.badge-must { background: var(--accent); color: white; }
.badge-should { background: var(--surface-3); color: var(--text-muted); }
.badge-done { background: var(--accent-soft); color: var(--accent); }
.badge-lev { background: var(--purple-soft); color: var(--purple); }
.empty-state { border: 2px dashed var(--border); border-radius: var(--radius); padding: 40px 24px; text-align: center; color: var(--text-muted); background: rgba(253,251,245,0.5); }
.empty-state button { margin-top: 14px; }
.soft-warning { background: var(--warn-soft); color: var(--warn); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 12px; margin-bottom: 12px; border-left: 3px solid var(--warn); display: flex; align-items: center; gap: 8px; }
.soft-info { background: var(--info-soft); color: var(--info); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 12px; margin-bottom: 12px; border-left: 3px solid var(--info); }
.soft-success { background: var(--accent-soft); color: var(--accent); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 12px; margin-bottom: 12px; border-left: 3px solid var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.flex { display: flex; }
.flex-col { display: flex; flex-direction: column; }
.items-center { align-items: center; }
.items-start { align-items: flex-start; }
.justify-between { justify-content: space-between; }
.justify-end { justify-content: flex-end; }
.gap-1 { gap: 4px; } .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; } .gap-6 { gap: 24px; }
.mb-1 { margin-bottom: 4px; } .mb-2 { margin-bottom: 8px; } .mb-3 { margin-bottom: 12px; } .mb-4 { margin-bottom: 16px; } .mb-6 { margin-bottom: 24px; }
.mt-1 { margin-top: 4px; } .mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; } .mt-4 { margin-top: 16px; }
.p-3 { padding: 12px; } .p-4 { padding: 16px; }
.text-muted { color: var(--text-muted); }
.text-soft { color: var(--text-soft); }
.text-sm { font-size: 13px; }
.text-lg { font-size: 16px; }
.text-xl { font-size: 20px; }
.text-2xl { font-size: 28px; }
.text-center { text-align: center; }
.font-bold { font-weight: 700; }
.font-medium { font-weight: 500; }
.italic { font-style: italic; }
.w-full { width: 100%; }
.cursor-pointer { cursor: pointer; }
.divider { height: 1px; background: var(--border); margin: 16px 0; }
.truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Sidebar */
#sidebar { width: 240px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; z-index: 10; }
.brand { padding: 22px 18px 18px; font-family: var(--serif); font-weight: 600; font-size: 20px; color: var(--accent); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px; }
.brand-mark { width: 28px; height: 28px; background: var(--accent); color: white; border-radius: 8px; display: grid; place-items: center; font-family: var(--sans); font-weight: 800; font-size: 13px; }
.nav-section { padding: 14px 18px 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-soft); }
.nav-item { padding: 10px 18px; cursor: pointer; color: var(--text-muted); font-weight: 500; transition: all 0.15s; border-right: 3px solid transparent; display: flex; align-items: center; gap: 11px; font-size: 14px; }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--accent-pale); color: var(--accent); border-right-color: var(--accent); font-weight: 600; }
.nav-icon { width: 18px; height: 18px; display: grid; place-items: center; font-size: 14px; }
.sidebar-footer { margin-top: auto; padding: 16px 18px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-soft); }

/* Main */
#main { flex-grow: 1; overflow-y: scroll; overflow-x: hidden; background: var(--bg); position: relative; scrollbar-width: none; -ms-overflow-style: none; }
#main::-webkit-scrollbar { display: none; }
.topbar { padding: 20px 36px; background: rgba(244,240,230,0.85); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 5; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.topbar h2 { font-family: var(--serif); font-weight: 500; font-size: 24px; letter-spacing: -0.5px; }
.content-area { padding: 32px 36px; max-width: 1280px; width: 100%; margin: 0 auto; overflow-x: hidden; }
.page-header { margin-bottom: 28px; }
.page-header h1 { font-family: var(--serif); font-weight: 500; font-size: 32px; letter-spacing: -0.5px; margin-bottom: 4px; }
.page-header p { color: var(--text-muted); font-size: 14px; }
.reading-copy { font-family: var(--sans); font-size: 16px; font-weight: 500; line-height: 1.7; letter-spacing: 0; white-space: pre-wrap; }
.reading-copy.lead { font-size: 18px; line-height: 1.65; }
.reading-copy.accent { color: var(--accent); }
.juicy-word-entry { font-family: var(--sans); font-size: 15px; font-weight: 500; line-height: 1.7; white-space: pre-wrap; }

/* Sub-tabs */
.sub-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 24px; overflow-x: hidden; overflow-y: hidden; scrollbar-width: none; -ms-overflow-style: none; }
.sub-tabs::-webkit-scrollbar { display: none; }
.sub-tab { padding: 10px 16px; cursor: pointer; color: var(--text-muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; font-size: 13px; white-space: nowrap; transition: all 0.15s; }
.sub-tab:hover { color: var(--text); }
.sub-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

/* Modal */
#modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(31,27,20,0.4); backdrop-filter: blur(4px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal { background: var(--surface); border-radius: var(--radius-lg); width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); border: 1px solid var(--border); }
.modal-lg { max-width: 720px; }
.modal-header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-header h3 { font-family: var(--serif); font-weight: 500; font-size: 20px; margin: 0; }
.modal-body { padding: 24px; }
.modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; background: var(--surface-2); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }

/* Step indicator */
.step-indicator { display: flex; gap: 6px; margin-bottom: 28px; padding: 6px; background: var(--surface-2); border-radius: 999px; }
.step-dot { flex: 1; height: 8px; border-radius: 999px; background: var(--surface-3); position: relative; transition: background 0.2s; }
.step-dot.active { background: var(--accent); }
.step-dot.completed { background: var(--accent-2); }
.step-wrap { display: flex; gap: 6px; margin-bottom: 24px; }
.step-tab { flex: 1; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; transition: all 0.15s; text-align: left; }
.step-tab.active { border-color: var(--accent); background: var(--accent-pale); }
.step-tab-num { font-family: var(--mono); font-size: 10px; color: var(--text-soft); }
.step-tab-title { font-weight: 600; font-size: 13px; color: var(--text); margin-top: 2px; }
.step-tab-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.step-tab.active .step-tab-num { color: var(--accent); }

/* Lists */
.checklist-item { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--surface-2); }
.checklist-item:last-child { border-bottom: none; }
.checklist-item input[type="checkbox"] { margin-top: 3px; }
.capture-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--surface-2); border-radius: var(--radius-sm); margin-bottom: 6px; font-size: 13px; }
.capture-row .x { margin-left: auto; opacity: 0.4; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
.capture-row .x:hover { opacity: 1; background: var(--danger-soft); color: var(--danger); }

/* RPM Block */
.rpm-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; border-left: 4px solid var(--accent); transition: all 0.15s; }
.rpm-block:hover { box-shadow: var(--shadow); }
.rpm-block.priority-top { border-left-color: var(--gold); background: linear-gradient(90deg, var(--gold-soft) 0%, var(--surface) 30%); }
.rpm-block.priority-high { border-left-color: var(--accent); }
.rpm-block.done-block { opacity: 0.6; }
.rpm-block-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.rpm-block-title { font-weight: 600; font-size: 14px; }
.rpm-block-purpose { font-size: 12px; color: var(--text-muted); font-style: italic; margin-top: 4px; }
.action-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; }
.action-item .check { width: 16px; height: 16px; border: 1.5px solid var(--border-strong); border-radius: 4px; cursor: pointer; display: grid; place-items: center; flex-shrink: 0; transition: all 0.15s; }
.action-item.done .check { background: var(--accent); border-color: var(--accent); color: white; }
.action-item.done .action-text { text-decoration: line-through; color: var(--text-muted); }
.action-item .action-text { flex: 1; }
.action-item .action-time { font-family: var(--mono); font-size: 11px; color: var(--text-soft); }
.action-item .action-lev { font-size: 11px; color: var(--purple); font-style: italic; }

/* Wheel */
.wheel-container { position: relative; width: 320px; height: 320px; margin: 0 auto; }
.wheel-container canvas { display: block; }
.wheel-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: center; margin-top: 16px; font-size: 12px; }
.wheel-legend-item { display: flex; align-items: center; gap: 6px; }
.wheel-legend-dot { width: 10px; height: 10px; border-radius: 50%; }

/* Stats */
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
.stat-label { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-soft); margin-bottom: 6px; }
.stat-value { font-size: 26px; font-weight: 700; color: var(--text); font-family: var(--mono); letter-spacing: -0.5px; line-height: 1; }
.stat-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.stat-card.featured { background: var(--accent-pale); border-color: var(--accent-soft); }
.stat-card.featured .stat-value { color: var(--accent); }

/* Schedule */
.schedule-grid { display: grid; grid-template-columns: 64px 1fr; gap: 2px; }
.time-slot { text-align: right; font-size: 10px; color: var(--text-soft); padding-top: 6px; font-family: var(--mono); text-transform: uppercase; }
.time-row { border-top: 1px solid var(--surface-2); min-height: 44px; position: relative; padding: 4px 8px; }
.time-row:hover { background: var(--surface-2); }
.schedule-block { background: var(--accent-soft); border-left: 3px solid var(--accent); padding: 4px 8px; border-radius: 4px; font-size: 11px; margin-bottom: 2px; }
.schedule-block.appointment { background: var(--gold-soft); border-left-color: var(--gold); }
.schedule-block.committed { background: var(--info-soft); border-left-color: var(--info); }

/* Week grid */
.week-grid { display: grid; grid-template-columns: 50px repeat(7, minmax(60px, 1fr)); gap: 4px; }
.week-col-header { text-align: center; font-size: 11px; font-weight: 700; padding: 8px 4px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-soft); }
.week-col-header.today { color: var(--accent); }
.week-cell { border: 1px solid var(--border); min-height: 60px; background: var(--surface); border-radius: var(--radius-sm); padding: 4px; font-size: 11px; }

/* Tables */
table { width: 100%; border-collapse: collapse; text-align: left; }
th { padding: 12px 14px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-soft); background: var(--surface-2); border-bottom: 1px solid var(--border); text-align: left; }
td { padding: 12px 14px; border-bottom: 1px solid var(--surface-2); font-size: 13px; vertical-align: top; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--surface-2); }

/* Quote banner */
.quote-banner { background: linear-gradient(135deg, var(--accent-pale) 0%, var(--surface) 100%); border: 1px solid var(--accent-soft); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 24px; position: relative; overflow: hidden; }
.quote-banner::before { content: '"'; position: absolute; top: -20px; left: 12px; font-family: var(--serif); font-size: 100px; color: var(--accent-soft); opacity: 0.6; line-height: 1; }
.quote-banner-text { font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--accent); position: relative; line-height: 1.4; }
.quote-banner-author { font-size: 11px; color: var(--text-muted); margin-top: 8px; text-transform: uppercase; letter-spacing: 0.1em; }

/* Progress bar */
.progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.progress-bar { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s; }
.progress-bar.gold { background: var(--gold); }
.progress-bar.warn { background: var(--warn); }

/* Drag handle */
.drag-handle { color: var(--text-soft); cursor: grab; padding: 2px 4px; user-select: none; }
.drag-handle:hover { color: var(--text); }
.dragging { opacity: 0.4; }

/* Pill */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: var(--surface-2); border-radius: 999px; font-size: 12px; border: 1px solid var(--border); }
.pill.removable { padding-right: 4px; }
.pill-x { color: var(--text-soft); cursor: pointer; padding: 0 2px; border-radius: 50%; }
.pill-x:hover { background: var(--danger-soft); color: var(--danger); }

/* Toasts */
#toast-wrap { position: fixed; top: 24px; right: 24px; z-index: 200; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent); padding: 12px 18px; border-radius: var(--radius); box-shadow: var(--shadow-lg); font-size: 13px; animation: slideIn 0.2s ease-out; max-width: 320px; }
.toast.warn { border-left-color: var(--warn); }
.toast.error { border-left-color: var(--danger); }
.toast.gold { border-left-color: var(--gold); }
@keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* Onboarding */
.onboarding-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(31,27,20,0.55); backdrop-filter: blur(6px); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 20px; }
.onboarding-card { background: var(--surface); border-radius: var(--radius-lg); max-width: 600px; width: 100%; padding: 36px; box-shadow: var(--shadow-lg); border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
.onboarding-progress { display: flex; gap: 4px; margin-bottom: 24px; }
.onboarding-progress div { flex: 1; height: 4px; background: var(--surface-3); border-radius: 2px; }
.onboarding-progress div.done { background: var(--accent); }

/* Reminder banner */

<script>
// ============================================================
// STATE & PERSISTENCE
// ============================================================
const DEFAULT_STATE = {
  drivingForce: {
    ultimateVision: "",
    ultimatePurpose: "",
    identity: {
      selfDescription: "",
      metaphor: "",
      dictionaryLine: ""
    },
    codeOfConduct: [],
    values: []
  },
  categories: [],
  roles: [],
  projects: [], blocks: [],
  weeklyPlans: [], dailyPlans: [], journal: [], juicyWords: [],
  communications: [], reviews: [],
  blockTemplates: [],
  habitTracker: { habits: [], checks: {}, nextId: 20 },
  nextId: 500,
  ui: { currentTab: 'dashboard', subTabs: {}, weeklyStep: 1, wpSub: 1 }
};
let state = JSON.parse(localStorage.getItem('rpmPlannerV3')) || DEFAULT_STATE;
state = Object.assign({}, DEFAULT_STATE, state);
state.ui = Object.assign({}, DEFAULT_STATE.ui, state.ui || {});
state.drivingForce = Object.assign({}, DEFAULT_STATE.drivingForce, state.drivingForce || {});
state.drivingForce.identity = Object.assign({}, DEFAULT_STATE.drivingForce.identity, state.drivingForce.identity || {});
state.habitTracker = Object.assign({}, DEFAULT_STATE.habitTracker, state.habitTracker || {});
state.habitTracker.habits = state.habitTracker.habits || [];
state.habitTracker.checks = state.habitTracker.checks || {};

const saveState = () => { localStorage.setItem('rpmPlannerV3', JSON.stringify(state)); };
const getNextId = () => state.nextId++;
const $ = id => document.getElementById(id);
const todayStr = () => new Date().toISOString().split('T')[0];
const formatDate = d => new Date(d).toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
const formatDateLong = d => new Date(d).toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
const html = (s, ...v) => s.reduce((a, x, i) => a + x + (v[i] || ''), '');

function toast(msg, kind='') {
  const t = document.createElement('div');
  t.className = 'toast ' + kind;
  t.textContent = msg;
  $('toast-wrap').appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// Modal
function showModal(content, lg=false) {
  $('modal-content').className = 'modal' + (lg ? ' modal-lg' : '');
  $('modal-content').innerHTML = content;
  $('modal-overlay').style.display = 'flex';
}
function closeModal() {
  $('modal-overlay').style.display = 'none';
  $('modal-content').innerHTML = '';
}

// Navigation
const TITLES = {
  dashboard: 'Dashboard', drivingForce: 'Driving Force', categories: 'Categories of Improvement',
  projects: 'Projects', blocks: 'RPM Blocks', weeklyPlan: 'Hour of Power',
  dailyPlan: 'Daily Plan', journal: 'Journal & Magic Moments', reviews: 'Reviews',
  analytics: 'Analytics', habits: 'Habits'
};
function nav(tab) {
  state.ui.currentTab = tab;
  saveState();
  render();
}
function setSubTab(tab, sub) {
  if(!state.ui.subTabs) state.ui.subTabs = {};
  state.ui.subTabs[tab] = sub;
  saveState();
  render();
}

document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => nav(el.dataset.nav));

// ============================================================
// WHEEL OF LIFE
// ============================================================
function drawWheelOfLife(canvas) {
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const cssSize = canvas.clientWidth;
  canvas.width = cssSize * dpr;
  canvas.height = cssSize * dpr;
  ctx.scale(dpr, dpr);
  const size = cssSize;
  const center = size / 2;
  const radius = (size / 2) - 40;
  ctx.clearRect(0, 0, size, size);

  const cats = state.categories;
  if(cats.length === 0) {
    ctx.fillStyle = '#948B78';
    ctx.font = "13px 'DM Sans'";
    ctx.textAlign = "center";
    ctx.fillText("Add categories to see your wheel", center, center);
    return;
  }

  // Background rings (10 levels)
  ctx.strokeStyle = '#E8E1CC';
  ctx.lineWidth = 1;
  for(let i=1; i<=10; i++) {
    ctx.beginPath();
    ctx.arc(center, center, (radius/10)*i, 0, 2*Math.PI);
    ctx.stroke();
  }

  // Axes
  const angleStep = (2 * Math.PI) / cats.length;
  ctx.strokeStyle = '#D8CFB8';
  for(let i=0; i<cats.length; i++) {
    const angle = i * angleStep - Math.PI/2;
    ctx.beginPath();
    ctx.moveTo(center, center);
    ctx.lineTo(center + radius * Math.cos(angle), center + radius * Math.sin(angle));
    ctx.stroke();
  }

  // Data polygon (filled)
  ctx.beginPath();
  cats.forEach((cat, i) => {
    const angle = i * angleStep - Math.PI/2;
    const val = (cat.score || 0) / 10;
    const px = center + (radius * val) * Math.cos(angle);
    const py = center + (radius * val) * Math.sin(angle);
    if(i===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  });
  ctx.closePath();
  ctx.fillStyle = 'rgba(63, 94, 54, 0.18)';
  ctx.fill();
  ctx.strokeStyle = '#3F5E36';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Data points
  cats.forEach((cat, i) => {
    const angle = i * angleStep - Math.PI/2;
    const val = (cat.score || 0) / 10;
    const px = center + (radius * val) * Math.cos(angle);
    const py = center + (radius * val) * Math.sin(angle);
    ctx.beginPath();
    ctx.arc(px, py, 4, 0, 2*Math.PI);
    ctx.fillStyle = '#3F5E36';
    ctx.fill();
  });

  // Labels
  ctx.fillStyle = '#1F1B14';
  ctx.font = "600 11px 'DM Sans'";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  cats.forEach((cat, i) => {
    const angle = i * angleStep - Math.PI/2;
    const lx = center + (radius + 22) * Math.cos(angle);
    const ly = center + (radius + 22) * Math.sin(angle);
    let label = cat.name.length > 14 ? cat.name.substring(0, 12) + '…' : cat.name;
    ctx.fillText(label, lx, ly);
    // Score below label
    ctx.fillStyle = '#6B6353';
    ctx.font = "10px 'Space Mono'";
    ctx.fillText(cat.score + '/10', lx, ly + 12);
    ctx.fillStyle = '#1F1B14';
    ctx.font = "600 11px 'DM Sans'";
  });
}

function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function renderPlainText(text) {
  return escapeHtml(String(text || '')
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/(\*\*\*|\*\*|__|~~|`)/g, '')
    .replace(/^>\s?/gm, ''));
}
function renderMarkdown(text) {
  if(!text) return '';
  let s = escapeHtml(text);
  s = s.replace(/^### (.+)$/gm, '<h4 style="margin:8px 0 4px;font-size:14px">$1</h4>');
  s = s.replace(/^## (.+)$/gm, '<h3 style="margin:10px 0 6px;font-size:16px">$1</h3>');
  s = s.replace(/^# (.+)$/gm, '<h2 style="margin:12px 0 8px;font-size:18px">$1</h2>');
  s = s.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  s = s.replace(/~~(.+?)~~/g, '<del>$1</del>');
  s = s.replace(/`([^`]+)`/g, '<code style="background:var(--surface-2);padding:1px 4px;border-radius:3px;font-size:13px">$1</code>');
  s = s.replace(/^---+$/gm, '<hr style="border:none;border-top:1px solid var(--border);margin:8px 0">');
  s = s.replace(/^> (.+)$/gm, '<blockquote style="border-left:3px solid var(--accent);padding-left:10px;color:var(--text-muted);margin:6px 0">$1</blockquote>');
  s = s.replace(/\n/g, '<br>');
  return s;
}

window.pairwiseRankValues = () => {
  let vals = state.drivingForce.values.map(v => ({ ...v }));
  if(vals.length < 2) { toast('Add at least 2 values first', 'warn'); return; }
  let i = 0, j = 1;
  const next = (winner) => {
    if(winner) { const loser = vals.splice(j, 1)[0]; vals.splice(vals.indexOf(winner)+1, 0, loser); }
    if(j < vals.length - 1) { j++; next(); return; }
    if(i < vals.length - 2) { i++; j = i + 1; next(); return; }
    state.drivingForce.values = vals;
    saveState(); closeModal(); render();
    toast('Ranked');
  };
  const ask = () => {
    if(i >= vals.length - 2 && j >= vals.length - 1) { next(null); return; }
    const a = vals[i], b = vals[j];
    showModal(`
      <div class="modal-header"><h3>Which matters more? <span class="text-muted text-sm">${i+1}/${vals.length-1} vs ${j+1}/${vals.length}</span></h3></div>
      <div class="modal-body">
        <p class="text-muted text-sm mb-3">Be honest — not what should matter, what actually does.</p>
        <div class="grid-2">
          <button class="card" style="cursor:pointer;text-align:left" onclick="answerPair('${a.id}')">
            <span class="section-title">A</span>
            <div class="text-lg font-bold">${escapeHtml(a.name)}</div>
            <div class="text-sm text-muted">${escapeHtml(a.rule || '—')}</div>
          </button>
          <button class="card" style="cursor:pointer;text-align:left" onclick="answerPair('${b.id}')">
            <span class="section-title">B</span>
            <div class="text-lg font-bold">${escapeHtml(b.name)}</div>
            <div class="text-sm text-muted">${escapeHtml(b.rule || '—')}</div>
          </button>
        </div>
        <button class="btn-ghost btn-sm mt-3" onclick="answerPair(null)">Tie / equal</button>
      </div>
    `, true);
  };
  window.answerPair = (winnerId) => {
    const winner = winnerId ? vals.find(v => v.id == winnerId) : null;
    next(winner);
    ask();
  };
  ask();

window.duplicateProject = (id) => {

function renderBlocks() {

function renderBlockCard(b, isTemplate) {

          <h4 style="margin:0;font-size:16px">${escapeHtml(b.result)}</h4>

      <div class="text-sm text-muted mb-2">${act.length} action${act.length===1?'':'s'} · ${done} done</div>

      ${act.length < 3 && act.length > 0 ? '<div class="soft-warning mt-2">⚠ Less than 3 actions — you may be over-chunking</div>' : ''}

        <button class="btn-secondary btn-sm" style="flex:1" onclick="editBlockModal(${b.id}, ${b.projectId||'null'}, ${isTemplate})">${isTemplate?'Edit':'Open'}</button>
        ${!isTemplate ? `<button class="btn-ghost btn-sm" onclick="saveBlockAsTemplate(${b.id})" title="Save as template">★ Template</button>` : `<button class="btn-primary btn-sm" onclick="instantiateTemplate(${b.id})">Use</button>`}

window.saveBlockAsTemplate = (id) => {
  const b = state.blocks.find(x=>x.id===id);
  if(!b) return;

  state.blockTemplates.push({ ...b, id: getNextId(), isTemplate: true, projectId: null });

window.editBlockModal = (id, projId, fromTemplate, prefill) => {
  const isNew = !id;
  let b;
  if(prefill) b = prefill;
  else if(isNew) b = { result:'', purpose:'', status:'not started', actions:[] };
  else b = state.blocks.find(x=>x.id===id);

  if(!b) return;
  // work on a copy so we can cancel
  window._editingBlock = JSON.parse(JSON.stringify(b));
  _renderBlockModal(id, projId, fromTemplate, isNew);
};
function _renderBlockModal(id, projId, fromTemplate, isNew) {
  const b = window._editingBlock;
  const projOpts = state.projects.map(p => `<option value="${p.id}" ${p.id==b.projectId?'selected':''}>${escapeHtml(p.title)}</option>`).join('');

  showModal(`
    <div class="modal-header"><h3>${isNew?'New':'Edit'} RPM Block</h3><button class="btn-icon" onclick="closeModal()">✕</button></div>
    <div class="modal-body">

      <div class="flex-col gap-3">

          <label class="section-title">Result — what specifically do I want?</label>
          <input type="text" id="mb-res" value="${escapeHtml(b.result)}" placeholder="What is the most important Result/Outcome I must produce for this day (week/project) to be successful and fulfilling? Specific, measurable, dated.">
          <div id="mb-res-warn"></div>
        </div>
        <div><label class="section-title">Purpose — why does it matter?</label><textarea id="mb-purp" placeholder="What is my Purpose? Why do I want to do this? What will it give me? What is my real Outcome? What is the specific, measurable Result I am committed to achieving?">${escapeHtml(b.purpose||'')}</textarea></div>

          <div><label class="section-title">Project</label>

          </div>
          <div><label class="section-title">Status</label>
            <select id="mb-status">

              <option value="in progress" ${b.status==='in progress'?'selected':''}>In Progress</option>
              <option value="done" ${b.status==='done'?'selected':''}>Done</option>
              <option value="abandoned" ${b.status==='abandoned'?'selected':''}>Abandoned</option>

          </div>
        </div>

          </div>

            ${(b.actions||[]).map((a,i) => renderBlockActionRow(a, i)).join('')}
          </div>
          ${(b.actions||[]).length < 3 && (b.actions||[]).length > 0 ? '<div class="soft-warning mt-2">⚠ Fewer than 3 actions — is this really one block, or two smaller ones?</div>' : ''}
          ${(b.actions||[]).length === 0 ? '<p class="text-soft text-sm" style="padding:12px;text-align:center">No actions yet. Add the smallest concrete steps that would prove the result.</p>' : ''}
        </div>
        <label class="flex items-center gap-2 text-sm">
          <input type="checkbox" id="mb-istpl" ${b.isTemplate?'checked':''}>
          <span>Save as reusable template (Pathway to Power)</span>
        </label>
      </div>
    </div>
    <div class="modal-footer">
      ${!isNew ? `<button class="btn-danger" onclick="delBlock(${id})">Delete</button>` : '<span></span>'}
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="saveBlock()">Save Block</button>
    </div>
  `, true);

  // Soft validation: re-check the Result on input
  $('mb-res').addEventListener('input', checkResultSpecificity);
  checkResultSpecificity();
}
function checkResultSpecificity() {
  const v = $('mb-res').value;
  const warn = $('mb-res-warn');
  const hasNumber = /\d/.test(v);
  const hasDate = /(mon|tue|wed|thu|fri|sat|sun|jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec|\d{1,2}[\/\-]\d|by\s+\w)/i.test(v);
  const hasConcrete = v.split(' ').filter(w => w.length > 3).length >= 3;
  if(v.length > 5 && (!hasNumber || !hasDate || !hasConcrete)) {
    warn.innerHTML = '<div class="soft-info" style="margin-top:6px">ℹ Strong Results are specific + measurable. Try adding a number, date, or concrete deliverable.</div>';
  } else {
    warn.innerHTML = '';
  }
}
function renderBlockActionRow(a, i) {
  return `
    <div class="flex items-center gap-2" style="padding:8px;background:var(--surface);border-radius:6px;margin-bottom:6px">
      <button class="check" style="width:18px;height:18px;border:1.5px solid var(--border-strong);border-radius:4px;cursor:pointer;display:grid;place-items:center;background:${a.status==='done'?'var(--accent)':'var(--surface)'};color:white" onclick="toggleBlockAction(${i})">${a.status==='done'?'✓':''}</button>
      <input type="text" value="${escapeHtml(a.text)}" oninput="window._editingBlock.actions[${i}].text=this.value" placeholder="Action" style="flex:1">
      <input type="number" value="${a.time||''}" oninput="window._editingBlock.actions[${i}].time=parseInt(this.value)||0" placeholder="min" style="width:70px" title="Time estimate (min)">
      <select onchange="window._editingBlock.actions[${i}].status=this.value" style="width:auto;padding:6px 8px;font-size:11px">
        <option value="must" ${a.status==='must'?'selected':''}>must</option>
        <option value="should" ${a.status==='should'?'selected':''}>should</option>
        <option value="done" ${a.status==='done'?'selected':''}>done</option>
        <option value="leveraged" ${a.status==='leveraged'?'selected':''}>leveraged</option>
        <option value="abandoned" ${a.status==='abandoned'?'selected':''}>abandoned</option>
      </select>
      <input type="text" value="${escapeHtml(a.leveragedTo||'')}" oninput="window._editingBlock.actions[${i}].leveragedTo=this.value" placeholder="leverage to..." style="width:120px;font-size:11px" title="Who are you leveraging this to?">
      <button class="btn-icon" onclick="removeBlockAction(${i})">✕</button>
    </div>
  `;
}
window.addBlockAction = () => {
  if(!window._editingBlock.actions) window._editingBlock.actions = [];
  window._editingBlock.actions.push({ text:'', status:'must', time:0 });
  $('mb-act-list').insertAdjacentHTML('beforeend', renderBlockActionRow(window._editingBlock.actions[window._editingBlock.actions.length-1], window._editingBlock.actions.length-1));
};
window.removeBlockAction = (i) => {
  window._editingBlock.actions.splice(i, 1);
  // re-render the list
  $('mb-act-list').innerHTML = window._editingBlock.actions.map((a,j) => renderBlockActionRow(a, j)).join('');
};
window.toggleBlockAction = (i) => {
  const a = window._editingBlock.actions[i];
  a.status = a.status === 'done' ? 'must' : 'done';
  $('mb-act-list').children[i].querySelector('.check').outerHTML = renderBlockActionRow(a, i).match(/<button[^>]*class="check"[^>]*>[\s\S]*?<\/button>/)[0];
};
window.saveBlock = () => {
  const id = $('mb-id').value;
  const pid = parseInt($('mb-proj').value) || null;
  const data = {
    result: $('mb-res').value.trim(),
    purpose: $('mb-purp').value.trim(),
    status: $('mb-status').value,
    priority: parseInt($('mb-priority').value) || 0,
    projectId: pid,
    actions: window._editingBlock.actions || [],
    isTemplate: $('mb-istpl').checked
  };
  if(!data.result) { toast('Result is required', 'warn'); return; }
  if(id) {
    const i = state.blocks.findIndex(x=>x.id==id);
    state.blocks[i] = { ...state.blocks[i], ...data };
  } else {
    const nid = getNextId();
    state.blocks.push({ id: nid, ...data });
    if(pid) {
      const p = state.projects.find(x=>x.id==pid);
      if(p) p.blockIds = [...(p.blockIds||[]), nid];
    }
  }
  saveState(); closeModal(); render(); toast('Block saved');
};
window.delBlock = (id) => {
  if(!confirm('Delete this block?')) return;
  state.blocks = state.blocks.filter(x=>x.id!==id);
  state.projects.forEach(p => { if(p.blockIds) p.blockIds = p.blockIds.filter(bid => bid !== id); });
  state.dailyPlans.forEach(dp => { dp.blockIds = dp.blockIds.filter(bid => bid !== id); });
  saveState(); closeModal(); render(); toast('Deleted');
};

// ============================================================
// 6. WEEKLY PLAN — HOUR OF POWER
// ============================================================
const WP_STEPS = [
  { num: 1, title: 'Connect to Driving Force', sub: '5-10 min' },
  { num: 2, title: 'Own Roles & Categories', sub: '10-15 min' },
  { num: 3, title: 'Create RPM Plan', sub: '30-45 min' },
  { num: 4, title: 'Set Yourself Up to Win', sub: '10 min' }
];
function renderWeeklyPlan() {
  const step = state.ui.weeklyStep || 1;
  // start-of-week (Mon)
  const today = new Date();
  const day = today.getDay() || 7;
  const monday = new Date(today);
  monday.setDate(today.getDate() - day + 1);
  const wsStr = monday.toISOString().split('T')[0];

  // ongoing weekly plan (work in progress) or load existing
  let wp = state.weeklyPlans.find(w => w.weekStart === wsStr);
  if(!wp) {
    wp = { id: getNextId(), weekStart: wsStr, captures: [], blockIds: [], top5: [], commits: [], schedules: [], challenges: [], review: null, completed: false };
    state.weeklyPlans.push(wp);
    saveState();
  }
  // session work-state mirrors
  window._wp = wp;

  const stepBar = `<div class="step-wrap">${WP_STEPS.map(s => `
    <div class="step-tab ${s.num===step?'active':''}" onclick="goToWPStep(${s.num})">
      <div class="step-tab-num">Step ${s.num} · ${s.sub}</div>
      <div class="step-tab-title">${s.title}</div>
    </div>
  `).join('')}</div>`;

  let body = '';
  if(step === 1) body = wpStep1();
  else if(step === 2) body = wpStep2();
  else if(step === 3) body = wpStep3();
  else if(step === 4) body = wpStep4();

  // top-right: mark complete / view history
  $('topbar-actions').innerHTML = `
    <button class="btn-ghost btn-sm" onclick="wpHistory()">History</button>
    ${wp.completed ? '<span class="badge badge-done">✓ Completed</span>' : `<button class="btn-gold btn-sm" onclick="completeWeeklyPlan()">Mark Week Complete</button>`}
  `;

  return `
    <div class="page-header">
      <h1>Hour of Power</h1>
      <p>Week of ${formatDate(wsStr)} · ${state.weeklyPlans.filter(w=>w.completed).length} weeks completed</p>
    </div>
    ${stepBar}
    <div id="wp-body">${body}</div>
  `;
}
window.goToWPStep = (n) => { state.ui.weeklyStep = n; saveState(); render(); };
window.wpHistory = () => {
  const past = [...state.weeklyPlans].sort((a,b) => new Date(b.weekStart) - new Date(a.weekStart));
  showModal(`
    <div class="modal-header"><h3>Weekly Plan History</h3><button class="btn-icon" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      ${past.length === 0 ? '<p class="text-muted">No history yet.</p>' : past.map(w => `
        <div class="card-flat" style="background:var(--surface-2);margin-bottom:8px">
          <div class="flex justify-between items-center">
            <div>
              <strong>Week of ${formatDate(w.weekStart)}</strong>
              ${w.completed?'<span class="badge badge-done">done</span>':'<span class="badge badge-hold">in progress</span>'}
            </div>
            <div class="text-sm text-muted">${(w.blockIds||[]).length} blocks · ${(w.top5||[]).length} top</div>
          </div>
        </div>
      `).join('')}
    </div>
    <div class="modal-footer"><button class="btn-secondary" onclick="closeModal()">Close</button></div>
  `);
};

function wpStep1() {

function wpStep2() {
  const sortedCats = [...state.categories].sort((a,b) => (a.score||0) - (b.score||0));
  return `
    <p class="text-muted mb-3">Here's the life you're owning. Look at the categories. Which ones are you proud of? Which need attention this week?</p>

            <div class="mb-2">

    <div class="flex justify-between mt-4">

}

function wpStep3() {
  const sub = state.ui.wpSub || 1;
  const wp = window._wp;
  const subTabs = [
    { n: 1, t: 'Review Last Week' },
    { n: 2, t: 'Brain-Dump Capture' },
    { n: 3, t: 'Convert to Blocks' },
    { n: 4, t: 'Prioritize + Top 3-5' },
    { n: 5, t: 'Commit to Days' },
    { n: 6, t: 'Schedule' }
  ];
  const subBar = `<div class="sub-tabs">${subTabs.map(s => `<div class="sub-tab ${s.n===sub?'active':''}" onclick="goToWPSub(${s.n})">${s.n}. ${s.t}</div>`).join('')}</div>`;

  let content = '';
  if(sub === 1) content = wpStep3Review();
  else if(sub === 2) content = wpStep3Capture();
  else if(sub === 3) content = wpStep3Convert();
  else if(sub === 4) content = wpStep3Top();
  else if(sub === 5) content = wpStep3Commit();
  else if(sub === 6) content = wpStep3Schedule();

  return subBar + content;
}
window.goToWPSub = (n) => { state.ui.wpSub = n; saveState(); render(); };

function wpStep3Review() {
  const past = [...state.weeklyPlans].filter(w => w.completed).sort((a,b) => new Date(b.weekStart) - new Date(a.weekStart))[0];
  if(!past) {
    return `<div class="empty-state"><p>No completed weeks yet. Your reviews will appear here as you complete them.</p></div>
    <div class="flex justify-between mt-4"><button class="btn-secondary" onclick="goToWPStep(2)">← Back</button><button class="btn-primary" onclick="goToWPSub(2)">Next: Capture →</button></div>`;
  }
  const pastBlocks = state.blocks.filter(b => (past.blockIds||[]).includes(b.id));
  const accomplished = pastBlocks.filter(b => b.status === 'done');
  const notDone = pastBlocks.filter(b => b.status !== 'done' && b.status !== 'abandoned');
  return `
    <div class="card-elevated">
      <div class="section-title" style="font-size:14px;margin-bottom:14px">Week of ${formatDate(past.weekStart)}</div>
      <div class="grid-2">
        <div>
          <span class="section-title" style="color:var(--accent)">Accomplishments (${accomplished.length})</span>
          ${accomplished.length ? accomplished.map(b => `<div class="capture-row"><span>✓ ${escapeHtml(b.result)}</span></div>`).join('') : '<p class="text-soft text-sm">None completed</p>'}
        </div>
        <div>
          <span class="section-title" style="color:var(--warn)">Not Done — carry forward (${notDone.length})</span>
          ${notDone.length ? notDone.map(b => `<div class="capture-row"><span>○ ${escapeHtml(b.result)}</span><span class="x" onclick="carryBlock(${b.id})" title="Add to this week's capture">→</span></div>`).join('') : '<p class="text-soft text-sm">Nothing to carry</p>'}
        </div>
      </div>
      ${past.review ? `
        <div class="divider"></div>
        <div>
          <span class="section-title">Reflections</span>
          ${past.review.accomplishments ? `<p class="text-sm"><strong>What worked:</strong> ${escapeHtml(past.review.accomplishments)}</p>` : ''}
          ${past.review.lessons ? `<p class="text-sm mt-1"><strong>Lessons:</strong> ${escapeHtml(past.review.lessons)}</p>` : ''}
        </div>
      ` : ''}
    </div>
    <div class="flex justify-between mt-4">
      <button class="btn-secondary" onclick="goToWPStep(2)">← Back</button>
      <button class="btn-primary" onclick="goToWPSub(2)">Next: Capture →</button>
    </div>
  `;
}
window.carryBlock = (id) => {
  const wp = window._wp;
  if(!wp.blockIds.includes(id)) wp.blockIds.push(id);
  const b = state.blocks.find(x=>x.id===id);
  if(b) { b.status = 'not started'; }
  saveState();
  toast('Carried to this week');
  render();
};

function wpStep3Capture() {
  const wp = window._wp;

      </div>

        <div class="capture-row">
          <span>${renderMarkdown(c)}</span>
          <span class="x" onclick="removeCapture(${i})">✕</span>

}
window.addCapture = () => {

  if(!v) return;
  window._wp.captures.push(v);
  $('wp-cap').value = '';

window.removeCapture = (i) => { window._wp.captures.splice(i, 1); saveState(); render(); };

    b.status !== 'done' && b.status !== 'abandoned' &&
    !wp.blockIds.includes(b.id)

        </div>

          const proj = state.projects.find(p => p.id === b.projectId);
          return `
            <div class="capture-row" style="background:var(--surface)">
              <span style="flex:1"><span class="text-soft text-sm">${proj?escapeHtml(proj.title)+' · ':''}</span>${escapeHtml(b.result)}</span>
              <button class="btn-secondary btn-sm" onclick="commitToWeek(${b.id})">Add to week</button>
            </div>
          `;
        }).join('')}
      </div>
    </div>
    <div class="flex justify-between mt-4">
      <button class="btn-secondary" onclick="goToWPSub(2)">← Back</button>
      <button class="btn-secondary" onclick="editBlockModal()">+ Create blank block</button>
      <button class="btn-primary" onclick="goToWPSub(4)">Next: Prioritize →</button>
    </div>
  `;
}
window.convertCaptureToBlock = (i) => {
  const wp = window._wp;
  const cap = wp.captures[i];
  if(!cap) return;

window.moveWeekBlock = (id, dir) => {
  const wp = window._wp;

  const b = state.blocks.find(x=>x.id===bid);
  if(!b || !b.actions[ai]) return;
  b.actions[ai].status = b.actions[ai].status === 'done' ? 'must' : 'done';
  if(b.actions.every(a => a.status === 'done' || a.status === 'abandoned')) b.status = 'done';

};
window.cycleActStatus = (bid, ai) => {
  const b = state.blocks.find(x=>x.id===bid);
  if(!b) return;
  const cycle = ['must','should','done','leveraged','abandoned'];
  const cur = b.actions[ai].status || 'must';
  b.actions[ai].status = cycle[(cycle.indexOf(cur) + 1) % cycle.length];
  saveState(); render();
};

  weekly: [
    { key: 'accomplishments', label: 'What did I accomplish this week?' },

function renderReviews() {
  const sub = state.ui.subTabs.reviews || 'weekly';
  const tabs = ['weekly', 'monthly', 'quarterly', 'yearly'].map(t =>
    `<div class="sub-tab ${sub===t?'active':''}" onclick="setSubTab('reviews','${t}')">${t}</div>`
  ).join('');

  $('topbar-actions').innerHTML = `<button class="btn-primary" onclick="newReviewModal('${sub}')">+ New ${sub.charAt(0).toUpperCase()+sub.slice(1)} Review</button>`;

  const revs = state.reviews.filter(r => r.type === sub).sort((a,b) => new Date(b.date) - new Date(a.date));

  // Show "next due" reminder
  const dueMsg = reviewDueMessage(sub);

  return `
    <div class="page-header">
      <h1>Reviews</h1>
      <p>The cadence that makes it stick. Reflect, reset, recommit.</p>
    </div>
    <div class="sub-tabs">${tabs}</div>
    ${dueMsg ? `<div class="soft-info">📅 ${dueMsg}</div>` : ''}
    ${revs.length === 0 ? `<div class="empty-state"><p>No ${sub} reviews yet.</p><button class="btn-primary" onclick="newReviewModal('${sub}')">+ New ${sub.charAt(0).toUpperCase()+sub.slice(1)} Review</button></div>` : revs.map(r => `
      <div class="card-elevated">
        <div class="flex justify-between items-center mb-3">
          <div>
            <div class="font-bold">${formatDateLong(r.date)}</div>
            <div class="text-sm text-muted">${Object.keys(r.answers||{}).length} questions answered</div>
          </div>
          <div class="flex gap-1">
            <button class="btn-icon" onclick="newReviewModal('${sub}', ${r.id})">✎</button>
            <button class="btn-icon" onclick="delReview(${r.id})">🗑</button>
          </div>

        ${REVIEW_QUESTIONS[sub].map(q => r.answers && r.answers[q.key] ? `
          <div class="mb-3">
            <div class="section-title">${q.label}</div>
            <p class="text-sm" style="white-space:pre-wrap">${renderMarkdown(r.answers[q.key])}</p>
          </div>
        ` : '').join('')}
      </div>
    `).join('')}
  `;
}
function reviewDueMessage(sub) {
  const last = state.reviews.filter(r => r.type === sub).sort((a,b) => new Date(b.date) - new Date(a.date))[0];
  const intervals = { weekly: 7, monthly: 30, quarterly: 90, yearly: 365 };
  if(!last) return `No ${sub} review yet — start one now.`;
  const days = Math.floor((Date.now() - new Date(last.date)) / 86400000);
  const interval = intervals[sub];
  if(days >= interval) return `It's been ${days} days since your last ${sub} review. Time to do another.`;
  return `Last ${sub} review: ${days} days ago. Next due in ${interval - days} days.`;
}

function computeCoCStreak() {
  if(!state.drivingForce.codeOfConduct.length) return 0;
  // group daily plans by date, count days with all items checked
  // Simulated: use the historical data we have
  // Real implementation would need day-by-day CoC history
  let streak = 0;
  const today = new Date();
  for(let i=0; i<365; i++) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const ds = d.toISOString().split('T')[0];
    // approximate: check if any daily plan exists for that date with all blocks done
    const dp = state.dailyPlans.find(x => x.date === ds);
    if(!dp) break;
    const blocks = state.blocks.filter(b => dp.blockIds.includes(b.id));
    if(blocks.length && blocks.every(b => b.status === 'done')) streak++;
    else break;
  }
  return streak;
}
function computeWheelTrend() {
  return state.categories.map(c => {
    const hist = (c.scoreHistory || []).slice(-12);
    const current = c.score || 0;
    const points = hist.map(h => h.score);
    if(!points.length || points[points.length - 1] !== current) points.push(current);
    return {
      name: c.name,
      current,
      delta: points.length >= 2 ? current - points[0] : 0,
      points: points.slice(-12)
    };
  });
}

  const out = $('search-results');
  if(!q || q.length < 2) { out.innerHTML = '<p class="text-soft text-sm">Type at least 2 characters.</p>'; return; }
  const Q = q.toLowerCase();
  const matches = { Category: [], Project: [], Block: [], Journal: [] };
  state.categories.forEach(c => { if(c.name.toLowerCase().includes(Q) || (c.vision||'').toLowerCase().includes(Q)) matches.Category.push(c); });
  state.projects.forEach(p => { if(p.title.toLowerCase().includes(Q) || (p.ultimateResult||'').toLowerCase().includes(Q)) matches.Project.push(p); });
  state.blocks.forEach(b => { if(b.result.toLowerCase().includes(Q) || (b.purpose||'').toLowerCase().includes(Q)) matches.Block.push(b); });
  state.journal.forEach(j => { if((j.freeText||'').toLowerCase().includes(Q) || (j.magicMoments||'').toLowerCase().includes(Q)) matches.Journal.push(j); });
  const counts = Object.entries(matches).map(([k,v]) => `${v.length} ${k.toLowerCase()}${v.length===1?'':'s'}`).filter(s => !s.startsWith('0 '));
  if(counts.length === 0) { out.innerHTML = '<p class="text-soft text-sm">No matches.</p>'; return; }

function checkReminders() {
  const reminders = [];
  // Hour of Power: due Friday or Sunday if last completed > 7 days ago
  const lastWP = state.weeklyPlans.filter(w => w.completed).sort((a,b) => new Date(b.weekStart) - new Date(a.weekStart))[0];
  if(state.weeklyPlans.length > 0) {
    const lastCompleted = lastWP ? new Date(lastWP.weekStart) : new Date(0);
    const days = Math.floor((Date.now() - lastCompleted) / 86400000);
    if(days >= 7) reminders.push({ icon: '⏰', title: 'Hour of Power overdue', sub: `It's been ${days} days since your last weekly plan. Schedule a session.`, tab: 'weeklyPlan' });
  }
  // Monthly review
  const lastMonthly = state.reviews.filter(r => r.type === 'monthly').sort((a,b) => new Date(b.date) - new Date(a.date))[0];
  if(!lastMonthly || (Date.now() - new Date(lastMonthly.date)) / 86400000 >= 30) {
    reminders.push({ icon: '🌙', title: 'Monthly Review due', sub: 'Refresh category scores and set next month\'s outcomes.', tab: 'reviews' });
  }
  // Quarterly
  const lastQ = state.reviews.filter(r => r.type === 'quarterly').sort((a,b) => new Date(b.date) - new Date(a.date))[0];
  if(!lastQ || (Date.now() - new Date(lastQ.date)) / 86400000 >= 90) {
    reminders.push({ icon: '📅', title: 'Quarterly Review due', sub: 'Project health check + next quarter outcomes.', tab: 'reviews' });
  }
  return reminders;
}

function renderReminders() {
  const reminders = checkReminders();

  return reminders.map(r => `

  const now = new Date();
  let viewYear = now.getFullYear();
  let viewMonth = now.getMonth();

  function loadHabitState() {
    try {
      const s = state.habitTracker;
      if (s) return s;
    } catch(e) {}
    return { habits: [], checks: {}, nextId: 20 };
  }

  function saveHabitState() {
    state.habitTracker = hstate;
    saveState();
  }

  let hstate = loadHabitState();

  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }

  function checkKey(habitId, day) {
    return `${viewYear}-${viewMonth}-${habitId}-${day}`;
  }

  function isChecked(habitId, day) {
    return !!hstate.checks[checkKey(habitId, day)];
  }

  function isCheckedOnDate(habitId, date) {
    const key = `${date.getFullYear()}-${date.getMonth()}-${habitId}-${date.getDate()}`;
    return !!hstate.checks[key];
  }

  function toggleCheck(habitId, day) {
    const k = checkKey(habitId, day);
    if (hstate.checks[k]) delete hstate.checks[k];
    else hstate.checks[k] = 1;
    saveHabitState();
    render();
  }

  function todayDay() {
    if (viewYear === now.getFullYear() && viewMonth === now.getMonth())
      return now.getDate();
    return -1;
  }

  function getStreak(habitId) {
    const cursor = new Date();
    cursor.setHours(0, 0, 0, 0);

    // A streak from yesterday remains active until the current day is over.
    if (!isCheckedOnDate(habitId, cursor)) cursor.setDate(cursor.getDate() - 1);

    let streak = 0;
    while (isCheckedOnDate(habitId, cursor)) {
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    }
    return streak;
  }

  function setRing(id, pct) {
    const circ = 207.3;
    const el = document.getElementById(id);
    if(el) el.style.strokeDashoffset = circ - pct * circ;
  }

  function html() {
    return `
    <div class="habits-view" id="habitsView">
      <header class="app-header">
        <div class="app-title">
          <span class="flame">🔥</span>
          <h1>Habit Tracker</h1>
        </div>
        <div class="month-nav">
          <button class="nav-btn" onclick="Habits.changeMonth(-1)">‹</button>
          <div><div class="month-label" id="monthLabel">JUNE</div></div>
          <button class="nav-btn" onclick="Habits.changeMonth(1)">›</button>
          <div class="year-badge" id="yearLabel">2026</div>
        </div>
      </header>

      <div class="layout">
        <div class="left-col">

          <div class="card">
            <div class="card-title">Daily Percentage Progress</div>
            <div class="progress-chart" id="progressChart"></div>
          </div>

          <div class="card">
            <div class="card-title">My Habits</div>
            <div class="habit-table-wrap">
              <table class="habit-table" id="habitTable">
                <thead id="habitTableHead"></thead>
                <tbody id="habitTableBody"></tbody>
              </table>
            </div>
          </div>

          <div class="card">
            <div class="card-title">Today — <span id="todayLabel"></span></div>
            <div class="daily-summary">
              <div class="ring-wrap" style="width:64px;height:64px;">
                <svg viewBox="0 0 80 80" style="width:64px;height:64px;">
                  <circle class="ring-bg" cx="40" cy="40" r="33"/>
                  <circle class="ring-fill" id="todayRing" cx="40" cy="40" r="33"
                    stroke-dasharray="207.3" stroke-dashoffset="207.3"/>
                </svg>
                <div class="ring-label">
                  <span class="ring-pct" id="todayPct">0%</span>
                  <span class="ring-sub">today</span>
                </div>
              </div>
              <div>
                <div class="daily-text">
                  <div class="big-count" id="todayCount">0 / 0</div>
                  <div class="sub">habits completed today</div>
                </div>
                <div class="today-habits" id="todayHabitsList"></div>
              </div>
            </div>
          </div>

        </div>
        <div class="right-col">

          <div class="card" style="text-align:center;">
            <div class="card-title" style="text-align:left;">Progress</div>
            <div class="ring-container">
              <div class="ring-wrap">
                <svg viewBox="0 0 80 80">
                  <circle class="ring-bg" cx="40" cy="40" r="33"/>
                  <circle class="ring-fill" id="monthRing" cx="40" cy="40" r="33"
                    stroke-dasharray="207.3" stroke-dashoffset="207.3"/>
                </svg>
                <div class="ring-label">
                  <span class="ring-pct" id="monthPct">0%</span>
                  <span class="ring-sub">month</span>
                </div>
              </div>
              <div class="stats-row">
                <div class="ring-stat">
                  <div class="big" id="totalChecked">0</div>
                  <div class="lbl">Done</div>
                </div>
                <div class="ring-stat" style="color:var(--text-muted);">
                  <div class="big" style="color:var(--text-muted);" id="totalPossible">0</div>
                  <div class="lbl">Total</div>
                </div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-title">Analytics</div>
            <div class="analytics-grid" id="analyticsGrid"></div>
          </div>

          <div class="card">
            <div class="card-title">🔥 Streaks</div>
            <div class="streak-list" id="streakList"></div>
          </div>

        </div>
      </div>

      <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)Habits.closeModal()">
        <div class="modal">
          <h2>Add New Habit</h2>
          <input type="text" id="habitNameInput" placeholder="e.g. Morning Workout 💪" maxlength="40" onkeydown="if(event.key==='Enter')Habits.addHabit(); if(event.key==='Escape')Habits.closeModal();"/>
          <div class="modal-actions">
            <button class="btn-secondary" onclick="Habits.closeModal()">Cancel</button>
            <button class="btn-primary" onclick="Habits.addHabit()">Add Habit</button>
          </div>
        </div>
      </div>
    </div>`;
  }

  function render() {
    const days = daysInMonth(viewYear, viewMonth);
    const td = todayDay();
    const habits = hstate.habits;

    document.getElementById('monthLabel').textContent = MONTHS[viewMonth];
    document.getElementById('yearLabel').textContent = viewYear;

    const tStr = td > 0
      ? `${MONTHS[viewMonth].slice(0,3)} ${td}, ${viewYear}`
      : `${MONTHS[viewMonth].slice(0,3)} ${viewYear}`;
    document.getElementById('todayLabel').textContent = tStr;

    // Progress chart
    const chartEl = document.getElementById('progressChart');
    chartEl.innerHTML = '';
    for (let d = 1; d <= days; d++) {
      const total = habits.length;
      const done = habits.filter(h => isChecked(h.id, d)).length;
      const pct = total ? done / total : 0;
      const isFuture = td > 0 && d > td;
      const isToday = d === td;
      const wrap = document.createElement('div');
      wrap.className = 'bar-wrap';
      const bar = document.createElement('div');
      bar.className = 'bar' + (isToday ? ' today' : '') + (isFuture ? ' future' : '');
      bar.style.height = isFuture ? '4px' : Math.max(4, Math.round(pct * 56)) + 'px';
      bar.title = `Day ${d}: ${Math.round(pct*100)}%`;
      wrap.appendChild(bar);
      chartEl.appendChild(wrap);
    }

    // Habit table
    const thead = document.getElementById('habitTableHead');
    const tbody = document.getElementById('habitTableBody');
    thead.innerHTML = '';
    tbody.innerHTML = '';

    const hr = document.createElement('tr');
    const nameTh = document.createElement('th');
    nameTh.className = 'habit-name-col';
    nameTh.textContent = 'Habit';
    hr.appendChild(nameTh);
    for (let d = 1; d <= days; d++) {
      const th = document.createElement('th');
      const dow = new Date(viewYear, viewMonth, d).getDay();
      th.textContent = d;
      th.title = DAY_ABBR[dow];
      if (d === td) th.style.color = 'var(--warn)';
      if (dow === 0 && d > 1) th.className = 'week-sep';
      hr.appendChild(th);
    }
    thead.appendChild(hr);

    habits.forEach((habit, idx) => {
      const tr = document.createElement('tr');
      const td_name = document.createElement('td');
      td_name.className = 'name-cell';
      td_name.innerHTML = `
        <span class="habit-num">${idx + 1}</span>
        <span class="habit-name-text">${habit.name}</span>
        <span class="habit-emoji">${habit.emoji}</span>
        <button class="del-habit-btn" title="Remove habit" onclick="Habits.deleteHabit(${habit.id})">✕</button>
      `;
      tr.appendChild(td_name);

      for (let d = 1; d <= days; d++) {
        const tdEl = document.createElement('td');
        const isFuture = td > 0 && d > td;
        const cell = document.createElement('div');
        cell.className = 'day-cell' +
          (isChecked(habit.id, d) ? ' checked' : '') +
          (isFuture ? ' future' : '') +
          (d === todayDay() ? ' today-col' : '');
        const dow = new Date(viewYear, viewMonth, d).getDay();
        if (dow === 0 && d > 1) tdEl.className = 'week-sep';
        if (!isFuture) {
          cell.addEventListener('click', () => toggleCheck(habit.id, d));
        }
        tdEl.appendChild(cell);
        tr.appendChild(tdEl);
      }
      tbody.appendChild(tr);
    });

    // Add habit row
    const addRow = document.createElement('tr');
    addRow.className = 'add-habit-row';
    const addTd = document.createElement('td');
    addTd.colSpan = days + 1;
    addTd.innerHTML = `<button class="add-habit-btn" onclick="Habits.openModal()">＋ Add Habit</button>`;
    addRow.appendChild(addTd);
    tbody.appendChild(addRow);

    // Overall progress ring
    const totalPossible = td > 0
      ? habits.length * td
      : habits.length * days;
    let totalDone = 0;
    const end = td > 0 ? td : days;
    for (let d = 1; d <= end; d++) {
      habits.forEach(h => { if (isChecked(h.id, d)) totalDone++; });
    }
    const monthPct = totalPossible ? totalDone / totalPossible : 0;
    document.getElementById('monthPct').textContent = Math.round(monthPct * 100) + '%';
    document.getElementById('totalChecked').textContent = totalDone;
    document.getElementById('totalPossible').textContent = totalPossible;
    setRing('monthRing', monthPct);

    // Today ring
    if (td > 0) {
      const todayDone = habits.filter(h => isChecked(h.id, td)).length;
      const todayTotal = habits.length;
      const todayPct = todayTotal ? todayDone / todayTotal : 0;
      document.getElementById('todayPct').textContent = Math.round(todayPct * 100) + '%';
      document.getElementById('todayCount').textContent = `${todayDone} / ${todayTotal}`;
      setRing('todayRing', todayPct);

      const listEl = document.getElementById('todayHabitsList');
      listEl.innerHTML = '';
      habits.slice(0, 6).forEach(h => {
        const item = document.createElement('div');
        item.className = 'today-habit-item';
        const chk = document.createElement('div');
        chk.className = 'mini-check' + (isChecked(h.id, td) ? ' checked' : '');
        chk.addEventListener('click', () => toggleCheck(h.id, td));
        const lbl = document.createElement('span');
        lbl.textContent = h.name + (h.emoji ? ' ' + h.emoji : '');
        item.appendChild(chk);
        item.appendChild(lbl);
        listEl.appendChild(item);
      });
    } else {
      document.getElementById('todayPct').textContent = '—';
      document.getElementById('todayCount').textContent = '— / —';
    }

    // Analytics
    const analyticsEl = document.getElementById('analyticsGrid');
    analyticsEl.innerHTML = '';
    const analyticsHabits = [...habits].map(h => {
      let done = 0;
      for (let d = 1; d <= end; d++) if (isChecked(h.id, d)) done++;
      const pct = end ? done / end : 0;
      return { ...h, pct, done, end };
    }).sort((a, b) => b.pct - a.pct);

    analyticsHabits.forEach(h => {
      const row = document.createElement('div');
      row.className = 'analytics-row';
      row.innerHTML = `
        <span class="habit-label" title="${h.name}">${h.name}</span>
        <div class="pct-bar-wrap"><div class="pct-bar-fill" style="width:${Math.round(h.pct*100)}%"></div></div>
        <span class="pct-label">${Math.round(h.pct*100)}%</span>
      `;
      analyticsEl.appendChild(row);
    });

    // Streaks
    const streakEl = document.getElementById('streakList');
    streakEl.innerHTML = '';
    const streaks = habits.map(h => ({ ...h, streak: getStreak(h.id) }))
      .sort((a, b) => b.streak - a.streak)
      .slice(0, 8);
    streaks.forEach(h => {
      const item = document.createElement('div');
      item.className = 'streak-item';
      item.innerHTML = `
        <span class="s-name">${h.name} ${h.emoji}</span>
        <span class="streak-badge ${h.streak >= 7 ? 'hot' : ''}">${h.streak}d</span>
      `;
      streakEl.appendChild(item);
    });
  }

  // Habits CRUD
  function deleteHabit(id) {
    hstate.habits = hstate.habits.filter(h => h.id !== id);
    saveHabitState();
    render();
  }

  function openModal() {
    document.getElementById('habitNameInput').value = '';
    document.getElementById('modalOverlay').classList.add('open');
    document.getElementById('habitNameInput').focus();
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
  }

  function addHabit() {
    const raw = document.getElementById('habitNameInput').value.trim();
    if (!raw) return;
    const emojiMatch = raw.match(/(\p{Emoji}[\p{Emoji}\uFE0F\u200D]*)+$/u);
    const emoji = emojiMatch ? emojiMatch[0] : '';
    const name = emoji ? raw.slice(0, raw.lastIndexOf(emoji)).trim() : raw;
    hstate.habits.push({ id: hstate.nextId++, name: name || raw, emoji });
    saveHabitState();
    closeModal();
    render();
  }

  function changeMonth(dir) {
    viewMonth += dir;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    render();
  }

  return { html, render, changeMonth, deleteHabit, openModal, closeModal, addHabit };
})();

// ============================================================
// INIT
// ============================================================
render();
showOnboarding();
</script>
</body>
</html>
